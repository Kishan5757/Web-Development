<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Playing Cards</title>
  <link rel="stylesheet" href="card.css">
</head>
<body>

<main id="playing-cards">

  <!-- Card 1 -->
  <div class="card">
    <div class="left">
      <div>A</div>
      <div>♠</div>
    </div>

    <div class="middle">
      <div>♠</div>
    </div>

    <div class="right">
      <div>A</div>
      <div>♠</div>
    </div>
  </div>

  <!-- Card 2 -->
  <div class="card">
    <div class="left">
      <div>2</div>
      <div>♣</div>
    </div>

    <div class="middle">
      <div>♣</div>
      <div class="rotate">♣</div>
    </div>

    <div class="right">
      <div>2</div>
      <div>♣</div>
    </div>
  </div>

  <!-- Card 3 -->
  <div class="card">
    <div class="left">
      <div>K</div>
      <div>♥</div>
    </div>

    <div class="middle">
      <div>♥</div>
      <div class="rotate">♥</div>
    </div>

    <div class="right">
      <div>K</div>
      <div>♥</div>
    </div>
  </div>

</main>

</body>
</html>
