<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;;
        }
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 93vh;

        }

        img {
            width: 15vw;
            height: 18vh;
            border-radius: 4px;;
        }

        .image {
            position: relative;
        }

        .time {
            position: absolute;
            bottom: 8px;
            right: 8px;
            color: white;
            padding: 2px 4px;
            font-size: 12px;
            height: 15px;
            width: 30px;
            border-radius: 5px;
            background-color: rgba(0, 0, 0, 0.7);
        }

        .card {
            display: flex;
            flex-direction: column;
            background-color: black;
            margin-bottom: 60px;
        }

        .title {
            width: 60vw;
            color: white;
            height: 5vh;
            font-size: x-large;
            padding-left: 7px;
        }

        .gre {
            display: flex;
            width: 60vw;

            height: 5vh;
        }

        .chanel {
            width: 8vw;
            height: 3vh;
            color: white;
            ;
            margin-top: 7px;
            margin-left: 7px;
        }

        .views {
            width: 8vw;
            height: 3vh;
            color: white;
            margin-top: 7px;
            margin-left: 7px;
        }

        .month {
            width: 8vw;
            height: 3vh;
            color: white;
            margin-top: 7px;
            margin-left: 7px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="image">

            <img src="https://i.ytimg.com/vi/tVzUXW6siu0/hq720.jpg?sqp=-oaymwEXCNAFEJQDSFryq4qpAwkIARUAAIhCGAE=&rs=AOn4CLCgs3kt08JL2BJuEcjc4IMPB9i9NA"
                alt="image">
            <div class="time"></div>

        </div>

        <div class="card">

            <div class="title"></div>
            <div class="gre">
                <div class="chanel"></div>
                <div class="views"></div>
                <div class="month"></div>
            </div>
        </div>


    </div>
    <script src="jscard.js"></script>
</body>

</html>
