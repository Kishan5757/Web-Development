<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class and ID Example</title>
    <style>
        /* Class styling (dot .) */
        .highlight {
            background-color: yellow;
        }
        .red-text {
            color: red;
        }

        /* ID styling (hash #) */
        #special {
            background-color: lightblue;
            color: darkblue;
        }
    </style>
</head>
<body>
    <h1 class="highlight">This heading uses the "highlight" class</h1>
    <p class="highlight red-text">This paragraph has two classes: "highlight" and "red-text"</p>
    <p id="special">This paragraph uses the unique ID "special"</p>
</body>
</html>
