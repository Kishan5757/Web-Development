<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animation</title>
  <style>
    .outer-container {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 1200px;
      height: 700px;
      border: 2px solid black;
      background-color: rgb(84, 72, 72);
      display: flex;
      justify-content: left;
      align-items: flex-end;
      position: relative;
    }

    .box {
      position: absolute;
      width: 150px;
      height: 150px;
      background-color: rgb(255, 0, 0);
      border-radius: 70px;
      margin: 3px;
      animation: moveRight 2s linear infinite alternate,moveup 2s ease-out infinite alternate ;
      
    }

    @keyframes moveRight {
      from {
        left: 0;

      }

      to {
        left: 90%;

      }
    }

    @keyframes moveup {
      from {
        bottom: 0;

      }

      to {
        bottom: 50%;

      }

    }
  </style>
</head>

<body>
  <div class="outer-container">
    <div class="container">
      <div class="box"></div>
    </div>
  </div>
</body>

</html>
