<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline</title>
    <style>
        *{
            text-align: center;
            margin: 0;
            padding: 0;
        }
.r{
    border: 2px solid black;
    margin: 35px;
    display: inline-block;
    padding: 10px;
}
.op{
    border: 2px solid red;
    margin: 35px;
    display: inline-block;
    padding: 10px;
}
span{
    border: 2px solid blue;
    margin: 35px;
    padding: 10px;
}
/* There is also a property called display: none which will not display the element at all. */
    </style>
</head>
<body>
    <div class="r">
        I am a div
    </div>
    <div class="op">I am also a div</div>
    <span>I am a span</span>
</body>
</html>
