<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position</title>
    <style>
        .b{
            height: 20vh;
            width: 80vw;
            border: 2px solid black;
            padding: 23px;
            margin: 34px;
        }
        .b1{
            background-color: red;
            position: relative;
            top: 29px;
            left: 23px;
            z-index: 1;
            /* position: sticky; */
            /* top: 0px;
            height: 12px; */
        }
        .b2{
            background-color: green;
            /* position: absolute;
            top: 0px;
            left: 0px; */

        }
        .b3{
            background-color: blue;
            /* position: fixed;
            top: 23px;
            left: 2px; */
        }
        .b4{
            background-color: yellow;

        }
        .parent{
            height: 130vh;
            width: 100vw;
            border: 2px solid black;
            position: relative;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="b b1"></div>
        <div class="b b2"></div>
        <div class="b b3"></div>
        <div class="b b4"></div>
    </div>
</body>
</html>
