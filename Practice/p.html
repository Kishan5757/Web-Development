<!DOCTYPE html>
<html lang="en">

    <title>Practice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            background-color: lightgreen;
            gap: 10px;
            height: 50px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 19px;
        }
        main{
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 90vh;
        }
        .content{
            width: 300px;
            height: 300px;
            background-color: lightblue;
            border-radius: 19px;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <div>Home</div>
            <div>about</div>
            <div>contact</div>
        </nav>
    </header>
    <main>
        <div class="content"></div>
        <div class="content"></div>
    </main>
</body>
</html>
