<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex box</title>
    <style>
        .container {
            width: 80vw;
            height: 80vh;
            border: 2px solid red;
            display: flex;
            flex-direction: column;
            justify-content: center;
            /*Controls alignment along the main axis (horizontal by default).*/
            align-items: center;
            /*Controls alignment along the cross axis (vertical by default).*/
            flex-wrap: wrap;
            /*Allows items to wrap onto multiple lines if they exceed the container's width.*/
            gap: 20px;
            /*Sets the space between flex items.*/
            gap: 20px 30px;
            /*Sets the vertical and horizontal gaps between items.*/
            align-content: center;
        }

        .items {
            width: 100px;
            height: 100px;
            background-color: blue;
            color: white;

        }
    </style>
</head>

<body>
    <div class="container">
        <div class="items">1</div>
        <div class="items">2</div>
        <div class="items">3</div>
        <div class="items">4</div>
        <div class="items">5</div>

        <div class="items">2</div>
        <div class="items">3</div>

        <div class="items">3</div>
        <div class="items">4</div>
        <div class="items">5</div>
    </div>
</body>

</html>
