<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class and ID</title>
    <style>
        .highlight{
    background-color: aqua;
}
.red{
    color: red;
    background-color: thistle;
}
#style{
    color: blue;
    
}
    </style>
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>
<body>
    <p class="highlight">This is highlight</p>
    <div class="highlight red">This is the red</div>
    <p class="red" id="style">This in clude id</p>

</body>
</html>
<!-- 1. The class attribute
Purpose: Group elements together so they can share the same styling or behavior.

Key points:

Can be used on multiple elements at the same time.

An element can have multiple classes separated by spaces.

In CSS, classes are targeted with a dot (.).

In JavaScript, you can select them with document.querySelectorAll(".classname").


2. The id attribute
Purpose: Give a unique identifier to a single element.

Key points:

Must be unique on a page (only one element can have a specific id).

In CSS, IDs are targeted with a hash (#).

In JavaScript, you can select them with document.getElementById("idname").

Often used for in-page navigation or linking. -->
