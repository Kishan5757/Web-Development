<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadows</title>
    <!-- box-shadow: offset-x offset-y blur-radius spread-radius color inset; 
      this is the syntax of shadowing -->

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 30px;
        }

        h1 {
            text-shadow: 3px 3px 5px rgba(0, 0, 0, 0.5);
        }

        span {
            display: inline-block;
            margin: 20px;
            padding: 10px;
            border: 2px solid black;
            box-shadow: 4px 4px 8px rgba(0, 0, 0, 0.3);
        }

        /* Card styling */
        .dad {
            display: block;                  /* makes it behave like a card */
            width: 300px;                    /* fixed width */
            margin: 20px auto;               /* center horizontally */
            padding: 20px;
            background: white;               /* card background */
            border-radius: 12px;             /* rounded corners */
            border: 1px solid #ddd;          /* subtle border */
            color: #333;
            font-size: 18px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2), 
                        0 6px 20px rgba(0, 0, 0, 0.19);  /* card shadow */
        }
    </style>
</head>
<body>
    <h1>Shadows</h1>
    <div>
        <span>I am the god of shadows.</span>
    </div>

    <div class="dad">
        <h2>Card Title</h2>
        <p>I am your dad. I look like a card now!</p>
    </div>
    <div class="c" style="text-align: center;">
    <iframe width="560" height="315" src="https://www.youtube.com/embed/0jTmzWlAkdU?si=mNbwkrYOgg9Ne9BQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
</body>
</html>
