<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Types of css</title>
    <style>
        span{
            background-color: brown;
            color: aqua;
        }
    </style><!--this is internal css-->
    <link rel="stylesheet" href="style.css"><!--this is external css-->
</head>
<body>
    <h1>Types of css</h1>
    <div style="color: aqua;background-color: brown;">Inline css</div><!--this is inline css-->
    <span>Internal css</span>
    <p>External css</p>
</body>
</html>
