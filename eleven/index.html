<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Boxing concept
    </title>
    <style>
        *{
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        .Op {
            width: 200px;
            box-sizing: border-box;
            height: 100px;
            background-color: lightblue;
            border: 2px solid black;
            padding: 10px;
            margin: 20px;
        }
        .Op1 {
            width: 150px;
            box-sizing: border-box;
            height: 80px;
            background-color: lightgreen;
            border: 2px solid green;
            padding: 5px;
            margin: 20px;
        }
    </style>
</head>
<body>
    <div class="Op">I am a box</div>
    <div class="Op1">I am another box</div>
    
</body>
</html>
